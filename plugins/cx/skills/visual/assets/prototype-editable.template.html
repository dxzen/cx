<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{CHANGE_ID}} · editable prototype</title>
  <style>
    /* Prototype styles go here. Put editable design values in CSS variables. */
    :root {
      --primary: #2563eb;
      --surface: #ffffff;
      --text: #111827;
    }
  </style>
  <style data-cx-editor-asset>
{{CX_VISUAL_EDITOR_CSS}}
  </style>
</head>
<body>
  <main data-cx-prototype-root>
    <!-- AI-generated prototype DOM goes here. -->
  </main>

  <script type="application/json" id="cx-visual-schema">
{
  "changeId": "{{CHANGE_ID}}",
  "tokens": {
    "primary": { "type": "color", "label": "Primary", "cssVar": "--primary" }
  },
  "content": {},
  "states": {},
  "export": {
    "removeSelectors": ["[data-editor-only]"]
  }
}
  </script>

  <script type="application/json" id="cx-visual-saved-state">
{
  "changeId": "{{CHANGE_ID}}",
  "tweaks": {},
  "content": {},
  "tokens": {},
  "layout": {},
  "components": {},
  "interactions": {},
  "prototypeState": {},
  "updatedAt": "{{ISO_TIMESTAMP}}"
}
  </script>

  <script>
    /*
      Optional inner-prototype API. Use it when the prototype has stateful
      flows that cannot be controlled by DOM markers or CSS variables alone.
    */
    window.CXPrototype = {
      getState: function () { return {}; },
      setState: function (_patch) {},
      getEditableSchema: function () { return {}; }
    };
  </script>

  <script data-cx-editor-asset>
{{CX_VISUAL_EDITOR_JS}}
  </script>
</body>
</html>
